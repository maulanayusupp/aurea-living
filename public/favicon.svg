<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Aurea Living monogram seal: gold "A" mark on deep emerald. Source of
       truth for all favicons/app icons (see scripts/generate-favicons.mjs). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#143a31"/>
      <stop offset="1" stop-color="#0c221d"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e4cf97"/>
      <stop offset="1" stop-color="#c9a24b"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="188" fill="none" stroke="url(#gold)" stroke-width="6" opacity="0.55"/>
  <!-- Serif-inspired A with crossbar -->
  <path
    d="M256 116 L360 396 H316 L292 330 H220 L196 396 H152 Z M234 292 H278 L256 232 Z"
    fill="url(#gold)"
  />
</svg>
